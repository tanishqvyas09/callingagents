# Nginx reverse proxy for Team Lajja on Hetzner
# Place at: /etc/nginx/sites-available/lajja
# Then: ln -s /etc/nginx/sites-available/lajja /etc/nginx/sites-enabled/lajja
#
# Replace YOUR_DOMAIN with your actual domain or server IP.
# Run certbot for HTTPS after this is working on HTTP first.

server {
    listen 80;
    server_name YOUR_DOMAIN;

    # Redirect HTTP → HTTPS (uncomment after certbot setup)
    # return 301 https://$host$request_uri;

    # ── Frontend (Next.js) ───────────────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Allow iframe embedding — IMPORTANT: remove X-Frame-Options
        # Next.js already sets frame-ancestors via CSP, Nginx must not override
        proxy_hide_header  X-Frame-Options;

        # WebSocket support (for LiveKit & Next.js HMR)
        proxy_read_timeout 86400;
    }
}

