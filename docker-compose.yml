version: "3.9"

# ── Production docker-compose for Hetzner ────────────────────────────────────
# Usage:
#   cp .env.production .env
#   docker compose up -d --build

services:

  # ── Next.js Frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY}
    container_name: lajja-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      VOBIZ_SIP_TRUNK_ID: ${VOBIZ_SIP_TRUNK_ID}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Python NGO Agent ────────────────────────────────────────────────────────
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lajja-agent
    restart: unless-stopped
    environment:
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      VOBIZ_SIP_TRUNK_ID: ${VOBIZ_SIP_TRUNK_ID}
      OUTBOUND_TRUNK_ID: ${VOBIZ_SIP_TRUNK_ID}
      VOBIZ_SIP_DOMAIN: ${VOBIZ_SIP_DOMAIN}
      VOBIZ_USERNAME: ${VOBIZ_USERNAME}
      VOBIZ_PASSWORD: ${VOBIZ_PASSWORD}
      VOBIZ_OUTBOUND_NUMBER: ${VOBIZ_OUTBOUND_NUMBER}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_S3_ACCESS_KEY: ${SUPABASE_S3_ACCESS_KEY}
      SUPABASE_S3_SECRET: ${SUPABASE_S3_SECRET}
      SUPABASE_S3_ENDPOINT: ${SUPABASE_S3_ENDPOINT}
      SUPABASE_S3_REGION: ${SUPABASE_S3_REGION}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET}
      # Agent calls the frontend analyze API via internal Docker network
      ANALYZE_API_URL: http://frontend:3000/api/ngo-analyze
    depends_on:
      frontend:
        condition: service_healthy

networks:
  default:
    name: lajja-network
